<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal Persiapan ASAT — Matematika 10 &amp; 11 Kelompok Kuning</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #eab308;
    --primary-light: #fefce8;
    --primary-dark: #ca8a04;
    --correct: #0f7b4c;
    --correct-bg: #dcfce7;
    --wrong: #b91c1c;
    --wrong-bg: #fee2e2;
    --neutral: #78716c;
    --surface: #ffffff;
    --bg: #fffdf0;
    --border: #fde68a;
    --text: #1c1407;
    --text-secondary: #92400e;
    --accent: #d97706;
    --accent-light: #fef9c3;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--primary);
    color: #1c1407;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .school-name {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.85;
    letter-spacing: 0.03em;
  }
  .header-title {
    font-size: 16px;
    font-weight: 700;
  }
  .score-bar {
    display: flex;
    gap: 20px;
    font-size: 13px;
  }
  .score-item { text-align: center; }
  .score-val { font-size: 20px; font-weight: 700; display: block; line-height: 1.1; }
  .score-val.correct { color: #166534; }
  .score-val.wrong { color: #991b1b; }

  /* PROGRESS */
  .progress-wrap {
    background: var(--primary-dark);
    padding: 8px 20px 12px;
  }
  .progress-inner { max-width: 800px; margin: 0 auto; }
  .progress-text {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #fcd34d;
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* MAIN */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 16px 80px;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 28px 0 16px;
    border-bottom: 2px solid var(--primary-light);
    margin-bottom: 24px;
  }
  .section-icon {
    width: 44px; height: 44px;
    background: var(--primary);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: white;
    flex-shrink: 0;
  }
  .section-meta { }
  .section-title {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .section-desc {
    font-size: 12px;
    color: var(--neutral);
    margin-top: 2px;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 16px;
    transition: box-shadow 0.2s;
  }
  .question-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .q-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .q-tag {
    font-size: 11px; font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 99px;
    align-self: flex-start;
    margin-top: 6px;
  }
  .q-text {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    flex: 1;
  }
  .q-text sub, .q-text sup { font-size: 0.8em; }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    transition: all 0.15s ease;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
  }
  .option-btn .opt-letter {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .option-btn.selected-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
  }
  .option-btn.selected-wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .option-btn.reveal-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
  }
  .option-btn:disabled { cursor: default; }

  /* EXPLANATION */
  .explanation {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct { background: var(--correct-bg); color: var(--correct); border-left: 3px solid var(--correct); }
  .explanation.wrong { background: var(--wrong-bg); color: var(--wrong); border-left: 3px solid var(--wrong); }

  /* RESULTS */
  #results-panel {
    display: none;
    text-align: center;
    padding: 40px 24px;
  }
  #results-panel.show { display: block; }
  .result-emoji { font-size: 60px; margin-bottom: 16px; }
  .result-title { font-family: 'Lora', serif; font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .result-sub { color: var(--text-secondary); font-size: 15px; margin-bottom: 28px; }
  .result-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 420px; margin: 0 auto 32px;
  }
  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
  }
  .result-stat-num { font-size: 28px; font-weight: 700; display: block; }
  .result-stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* DIVIDER */
  .section-divider {
    text-align: center;
    margin: 32px 0 24px;
    position: relative;
  }
  .section-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
  }
  .section-divider-badge {
    position: relative;
    display: inline-block;
    background: var(--bg);
    padding: 4px 16px;
    border: 1px solid var(--border);
    border-radius: 99px;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* MATH display */
  .math { font-family: 'Lora', serif; font-style: italic; }
  .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.85em; line-height: 1.1; }
  .fraction .num { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
  .fraction .den { padding: 0 3px; }

  @media (max-width: 600px) {
    .header-inner { flex-wrap: wrap; gap: 8px; }
    .question-card { padding: 16px; }
    .result-grid { grid-template-columns: repeat(3, 1fr); }
    .btn-next, .btn-results { padding: 8px 12px; font-size: 12px; }
  }

  .btn-next {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: #eab308;
    color: #1c1407;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(234,179,8,0.4);
    z-index: 99;
  }
  .btn-next:hover { background: #facc15; box-shadow: 0 6px 20px rgba(234,179,8,0.5); }
  .btn-results {
    background: #eab308;
    color: #1c1407;
    border: none;
    border-radius: 12px;
    padding: 13px 32px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-results:hover { background: #facc15; }
  .btn-restart {
    background: #eab308;
    color: #1c1407;
    border: none;
    border-radius: 12px;
    padding: 13px 32px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    box-shadow: 0 4px 16px rgba(234,179,8,0.35);
  }
  .btn-restart:hover { background: #facc15; }
</style>
</head>

<div style="background:#ca8a04;text-align:center;padding:8px 20px;font-size:12px;color:#fff;letter-spacing:0.04em;font-weight:500;">
  The only way to <b>learn</b> mathematics is <b>to do</b> mathematics - Paul Halmos
</div>
<header>
  <div class="header-inner">
    <div>
      <div class="school-name">SMA IT Insan Sejahtera</div>
      <div class="header-title">Latihan Soal Persiapan ASAT Kelas 10 &amp; 11</div>
    </div>

<main id="quiz-main">

  <div style="font-size:12px;color:var(--text-secondary);letter-spacing:0.04em;font-weight:600;margin-bottom:4px;">SMA IT INSAN SEJAHTERA</div>
  <div style="font-size:11px;color:var(--text-secondary);margin-bottom:24px;">Matematika Kelas 10 &amp; 11 — ASAT Kelompok Kuning</div>
  <div class="result-emoji" id="res-emoji">🎉</div>

      <div class="result-stat-label">Benar</div>

      <span class="result-stat-num" id="res-wrong" style="color:var(--wrong)">0</span>
      <div class="result-stat-label">Salah</div>

    <div class="result-stat">

</div>

<script>
const sections = [
  {
    id: 'A',
    title: 'Relasi, Fungsi & Domain',
    desc: 'Soal 1–7 · Memahami konsep pemetaan, domain, dan range',
    icon: '⟶',
    questions: [
      {
        q: `Perhatikan himpunan pasangan berurutan berikut:<br><br>
<div style="display:flex;flex-direction:column;gap:10px;max-width:380px;margin:12px auto">
  <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:14px">
    <span style="font-weight:700;color:#a16207;margin-right:8px">(I)</span> {(1, 3), (2, 3), (3, 5), (4, 7)}
  </div>
  <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:14px">
    <span style="font-weight:700;color:#a16207;margin-right:8px">(II)</span> {(1, a), (1, b), (2, c), (3, d)}
  </div>
  <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:14px">
    <span style="font-weight:700;color:#a16207;margin-right:8px">(III)</span> {(2, 4), (3, 9), (4, 16), (5, 25)}
  </div>
  <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:14px">
    <span style="font-weight:700;color:#a16207;margin-right:8px">(IV)</span> {(1, 2), (2, 4), (1, 6), (3, 8)}
  </div>
</div>
Yang termasuk pemetaan (fungsi) adalah…`,
        opts: ['I dan II', 'II dan III', 'I dan III', 'III dan IV', 'I dan IV'],
        ans: 2,
        tag: 'C2 – Memahami',
        exp: 'Syarat fungsi: setiap elemen domain dipetakan ke <strong>tepat satu</strong> elemen kodomain. (I) ✓ Fungsi — tiap x muncul sekali dengan satu y (boleh y sama). (II) ✗ Bukan — x=1 muncul dua kali dengan y berbeda (a dan b). (III) ✓ Fungsi — tiap x berbeda dan masing-masing punya tepat satu y. (IV) ✗ Bukan — x=1 muncul dua kali dengan y berbeda (2 dan 6). Jadi yang merupakan fungsi: I dan III.'
      },
      {
        q: 'Diketahui fungsi <i>f</i>(<i>x</i>) = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em"><span style="border-bottom:1.5px solid;padding:0 2px">3<i>x</i>+2</span><span style="padding:0 2px"><i>x</i>²−<i>b</i></span></span>. Jika daerah asal fungsi tersebut adalah seluruh bilangan real kecuali <i>x</i> = 3, maka nilai konstanta <i>b</i> yang memenuhi adalah…',
        opts: ['-9', '-3', '0', '3', '9'],
        ans: 4,
        tag: 'C2 – Memahami',
        exp: 'Agar x = 3 tidak termasuk domain, penyebut x²−b harus nol saat x = 3. Maka 3²−b = 0 → 9−b = 0 → b = 9.'
      },
      {
        q: 'Diketahui <i>f</i>(<i>x</i>) = 4<i>x</i> + 3 dan <i>g</i>(<i>x</i>) = <i>x</i> − 1. Nilai (<i>f</i> ∘ <i>g</i>)(3) adalah…',
        opts: ['11', '13', '15', '17', '19'],
        ans: 0,
        tag: 'C3 – Menerapkan',
        exp: 'g(3) = 3−1 = 2. Kemudian f(2) = 4(2)+3 = 8+3 = 11.'
      },
      {
        q: 'Invers dari fungsi <i>f</i>(<i>x</i>) = 5<i>x</i> − 3 adalah…',
        opts: [
          '<i>f</i>⁻¹(<i>x</i>) = 5<i>x</i>+3',
          '<i>f</i>⁻¹(<i>x</i>) = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em"><span style="border-bottom:1.5px solid;padding:0 2px"><i>x</i>+3</span><span style="padding:0 2px">5</span></span>',
          '<i>f</i>⁻¹(<i>x</i>) = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em"><span style="border-bottom:1.5px solid;padding:0 2px"><i>x</i>−3</span><span style="padding:0 2px">5</span></span>',
          '<i>f</i>⁻¹(<i>x</i>) = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em"><span style="border-bottom:1.5px solid;padding:0 2px">3−<i>x</i></span><span style="padding:0 2px">5</span></span>',
          '<i>f</i>⁻¹(<i>x</i>) = 5<i>x</i>+3'
        ],
        ans: 1,
        tag: 'C3 – Menerapkan',
        exp: 'y = 5x−3 → 5x = y+3 → x = (y+3)/5. Jadi f⁻¹(x) = (x+3)/5.'
      },
      {
        q: 'Domain dari fungsi <i>f</i>(<i>x</i>) = √(−<i>x</i>² + 4<i>x</i> + 12) adalah…',
        opts: ['-2 ≤ x ≤ 6', '-6 ≤ x ≤ 2', 'x ≤ -2 atau x ≥ 6', '2 ≤ x ≤ 6', '-2 ≤ x ≤ 2'],
        ans: 0,
        tag: 'C3 – Menerapkan',
        exp: 'Agar akar terdefinisi: −x²+4x+12 ≥ 0 → x²−4x−12 ≤ 0 → (x−6)(x+2) ≤ 0 → −2 ≤ x ≤ 6.'
      },
      {
        q: 'Diketahui <i>f</i>(<i>x</i>) = <i>x</i>² − 3 dan <i>g</i>(<i>x</i>) = <i>x</i>² − 2<i>x</i>. Bentuk (<i>g</i> ∘ <i>f</i>)(<i>x</i>) adalah…',
        opts: ['x⁴−6x²+7', 'x⁴+6x²+9', 'x⁴−2x²+6', 'x⁴−8x²+15', 'x⁴−6x²+9'],
        ans: 3,
        tag: 'C3 – Menerapkan',
        exp: '(g∘f)(x) = g(f(x)) = g(x²−3) = (x²−3)² − 2(x²−3) = x⁴−6x²+9 − 2x²+6 = x⁴−8x²+15.'
      },
      {
        q: 'Diketahui <i>f</i>(<i>x</i>) = √(<i>x</i> + 2) dan <i>g</i>(<i>x</i>) = 4 − <i>x</i>². Domain dari (<i>f</i> ∘ <i>g</i>)(<i>x</i>) adalah…',
        opts: ['x ≤ −√6 atau x ≥ √6', '−√6 ≤ x ≤ √6', 'x ≥ √6', '−√2 ≤ x ≤ √2', 'x ≤ −√2 atau x ≥ √2'],
        ans: 1,
        tag: 'C3 – Menerapkan',
        exp: '(f∘g)(x) = f(4−x²) = √(4−x²+2) = √(6−x²). Agar terdefinisi: 6−x² ≥ 0 → x² ≤ 6 → −√6 ≤ x ≤ √6.'
      },
    ]
  },
  {
    id: 'B',
    title: 'Komposisi & Dekomposisi Fungsi',
    desc: 'Soal 8–15 · Menentukan komposisi dan komponen fungsi',
    icon: '∘',
    questions: [
      {
        q: 'Diketahui <i>f</i> ∘ <i>g</i>(<i>x</i>) = 6<i>x</i> − 5 dan <i>f</i>(<i>x</i>) = 3<i>x</i> + 1. Fungsi <i>g</i>(<i>x</i>) adalah…',
        opts: ['2x−2', '2x−4', 'x−2', '2x+2', 'x+2'],
        ans: 0,
        tag: 'C3 – Menerapkan',
        exp: 'f(g(x)) = 6x−5 → 3g(x)+1 = 6x−5 → 3g(x) = 6x−6 → g(x) = 2x−2.'
      },
      {
        q: 'Diketahui <i>f</i> ∘ <i>g</i>(<i>x</i>) = 3<i>x</i>² − 6<i>x</i> + 8 dan <i>g</i>(<i>x</i>) = <i>x</i>² − 2<i>x</i> + 2. Fungsi <i>f</i>(<i>x</i>) adalah…',
        opts: ['f(x) = 3x−4', 'f(x) = 3x+2', 'f(x) = 3x−2', 'f(x) = 3x+4', 'f(x) = 3x+1'],
        ans: 1,
        tag: 'C3 – Menerapkan',
        exp: 'Misalkan u = g(x) = x²−2x+2. f(u) = 3(x²−2x+2)+2 = 3x²−6x+6+2 = 3x²−6x+8 ✓. Maka f(u) = 3u+2, sehingga f(x) = 3x+2.'
      },
      {
        q: 'Diketahui <i>f</i>(<i>x</i>) = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em"><span style="border-bottom:1.5px solid;padding:0 2px">4<i>x</i>−1</span><span style="padding:0 2px">2<i>x</i>+1</span></span>, <i>x</i> ≠ −½. Jika <i>f</i>⁻¹(<i>a</i>) = 2, nilai <i>a</i> adalah…',
        opts: ['2/3', '4/5', '7/5', '7/3', '3/2'],
        ans: 2,
        tag: 'C3 – Menerapkan',
        exp: 'f⁻¹(a) = 2 berarti f(2) = a. f(2) = (4·2−1)/(2·2+1) = 7/5. Jadi a = 7/5.'
      },

// Flatten & state
let allQ = [];
sections.forEach((sec, si) => {
  sec.questions.forEach((q, qi) => {
    allQ.push({ ...q, section: sec.id, sectionIdx: si, localIdx: qi });
  });
});

const TOTAL = allQ.length;
let answered = 0, correct = 0, wrong = 0;

function updateHeader() {
  document.getElementById('hdr-correct').textContent = correct;
  document.getElementById('hdr-wrong').textContent = wrong;
  const pct = Math.round((answered / TOTAL) * 100);
  document.getElementById('prog-text').textContent = `${answered} dari ${TOTAL} soal dijawab`;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function buildQuiz() {
  const main = document.getElementById('quiz-main');
  main.innerHTML = '';
  let qIndex = 0;

  sections.forEach((sec, si) => {
    const sh = document.createElement('div');
    sh.className = 'section-header';
    sh.innerHTML = `
      <div class="section-icon">${sec.icon}</div>
      <div class="section-meta">
        <div class="section-title">Bagian ${sec.id} — ${sec.title}</div>
        <div class="section-desc">${sec.desc}</div>
      </div>`;
    main.appendChild(sh);

    sec.questions.forEach((q, qi) => {
      qIndex++;
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-${qIndex}`;

      const letters = ['A','B','C','D','E'];
      const optsHTML = q.opts.map((opt, oi) => `
        <button class="option-btn" onclick="selectAnswer(${qIndex}, ${oi}, ${q.ans})" id="opt-${qIndex}-${oi}">
          <span class="opt-letter">${letters[oi]}</span>
          <span>${opt}</span>
        </button>`).join('');

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num">${qIndex}</div>
          <div class="q-text">${q.q}</div>
          <div class="q-tag">${q.tag}</div>
        </div>
        <div class="options">${optsHTML}</div>
        <div class="explanation" id="exp-${qIndex}"></div>
`;
      main.appendChild(card);
    });

    if (si < sections.length - 1) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.innerHTML = `<span class="section-divider-badge">Lanjut ke Bagian ${sections[si+1].id}</span>`;
      main.appendChild(div);
    }
  });

  const res = document.createElement('div');
  res.id = 'results-anchor';
  main.appendChild(res);

  const lihatBtn = document.createElement('div');
  lihatBtn.id = 'lihat-hasil-wrap';
  lihatBtn.style.cssText = 'text-align:center;padding:32px 0 16px;';
  lihatBtn.innerHTML = '<button class="btn-results" onclick="showResults()" style="padding:13px 40px;font-size:15px;">🏁 Lihat Hasil</button>';
  main.appendChild(lihatBtn);
}

function selectAnswer(qNum, chosen, correct_ans) {
  const letters = ['A','B','C','D','E'];
  const q = allQ[qNum - 1];

  for (let i = 0; i < q.opts.length; i++) {
    const btn = document.getElementById(`opt-${qNum}-${i}`);
    btn.disabled = true;
    if (i === correct_ans) btn.classList.add('reveal-correct');
  }

  const chosenBtn = document.getElementById(`opt-${qNum}-${chosen}`);
  const expEl = document.getElementById(`exp-${qNum}`);

  if (chosen === correct_ans) {
    chosenBtn.classList.add('selected-correct');
    expEl.className = 'explanation show correct';
    expEl.innerHTML = `✓ Benar! ${q.exp}`;
    correct++;
  } else {
    chosenBtn.classList.add('selected-wrong');
    expEl.className = 'explanation show wrong';
    expEl.innerHTML = `✗ Salah. Jawaban benar: <strong>${letters[correct_ans]}</strong>. ${q.exp}`;
    wrong++;
  }

  answered++;
  if (answered > lastAnsweredQ) lastAnsweredQ = answered;
  updateHeader();

  if (answered === TOTAL) {
    setTimeout(showResults, 1200);
  }
}

function showResults() {
  document.getElementById('quiz-main').style.display = 'none';
  const panel = document.getElementById('results-panel');
  panel.classList.add('show');
  panel.style.display = 'block';

  const pct = Math.round((correct / TOTAL) * 100);
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-score').textContent = pct + '%';

  let emoji = '😢', title = 'Terus Berlatih!', sub = 'Jangan menyerah, coba lagi ya!';
  if (pct >= 90) { emoji = '🏆'; title = 'Luar Biasa!'; sub = 'Nilai sempurna! Kamu sangat menguasai materi ini.'; }
  else if (pct >= 75) { emoji = '🎉'; title = 'Hebat!'; sub = 'Nilaimu sangat baik. Sedikit lagi sempurna!'; }
  else if (pct >= 60) { emoji = '👍'; title = 'Cukup Baik!'; sub = 'Pemahaman lumayan. Pelajari bagian yang masih salah.'; }
  else if (pct >= 40) { emoji = '📚'; title = 'Perlu Belajar Lagi'; sub = 'Ulang materi fungsi dan sistem persamaan linear ya!'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  answered = 0; correct = 0; wrong = 0;
  updateHeader();
  document.getElementById('results-panel').classList.remove('show');
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('quiz-main').style.display = 'block';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let lastAnsweredQ = 0;

function scrollToNext() {
  for (let i = 1; i <= TOTAL; i++) {
    const opt = document.getElementById('opt-' + i + '-0');
    if (opt && !opt.disabled) {
      document.getElementById('q-' + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
  const anchor = document.getElementById('results-anchor');
  if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });
}

buildQuiz();
updateHeader();
</script>

</div>
<button class="btn-next" id="btn-next" onclick="scrollToNext()">Soal berikutnya ↓</button>
</body>
</html>
