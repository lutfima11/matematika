<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal PU — Penalaran Umum UTBK</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fffdf8;
    --surface2: #f0ebe0;
    --border: #ddd6c8;
    --accent: #c05c1a;
    --accent2: #a04a10;
    --text: #2a2218;
    --text-muted: #8a7a66;
    --correct: #2d8a5e;
    --wrong: #c0392b;
    --blue: #2471a3;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%;
    right: -15%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(192,92,26,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245,240,232,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .header-logo {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .header-logo span {
    color: var(--text-muted);
    font-weight: 300;
    font-style: italic;
    font-size: 0.95rem;
  }

  .header-progress {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .progress-bar {
    width: 120px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 3rem 2rem 6rem;
    position: relative;
    z-index: 1;
  }

  .hero {
    text-align: center;
    margin-bottom: 4rem;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(192,92,26,0.08);
    border: 1px solid rgba(192,92,26,0.22);
    color: var(--accent);
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.9rem;
    border-radius: 99px;
    margin-bottom: 1.5rem;
  }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 0.75rem;
  }

  .hero h1 em {
    color: var(--accent);
    font-style: italic;
    font-weight: 300;
  }

  .hero p {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 460px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.8rem;
    padding: 0.45rem 1rem;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fffdf8;
    font-weight: 600;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
    transition: border-color 0.2s;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(16px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .q-card:hover { border-color: rgba(232,201,122,0.3); }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }

  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    background: rgba(192,92,26,0.08);
    border: 1px solid rgba(192,92,26,0.2);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    letter-spacing: 0.05em;
  }

  .q-type-badge {
    font-size: 0.68rem;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
  }
  .badge-pg   { background: rgba(36,113,163,0.1); color: var(--blue); border: 1px solid rgba(36,113,163,0.25); }
  .badge-bs   { background: rgba(45,138,94,0.1); color: var(--correct); border: 1px solid rgba(45,138,94,0.25); }
  .badge-esai { background: rgba(192,92,26,0.08); color: var(--accent2); border: 1px solid rgba(192,92,26,0.22); }

  .q-topic {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'DM Mono', monospace;
  }

  .q-text {
    font-size: 0.98rem;
    line-height: 1.75;
    margin-bottom: 1.5rem;
    color: var(--text);
  }

  .q-text .math-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1.2rem;
    font-size: 1rem;
    margin: 0.75rem 0;
    color: var(--text);
    overflow-x: auto;
    text-align: center;
  }


  .q-text .info-box {
    background: rgba(36,113,163,0.06);
    border-left: 3px solid var(--blue);
    padding: 0.75rem 1rem;
    border-radius: 0 8px 8px 0;
    margin: 0.75rem 0;
    font-size: 0.88rem;
    color: #1a4e6e;
    line-height: 1.6;
  }

  .svg-figure {
    display: flex;
    justify-content: center;
    margin: 1.2rem 0;
    padding: 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .svg-figure svg {
    max-width: 280px;
    width: 100%;
    height: auto;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.8rem 1.1rem;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
  }

  .option-item:hover {
    border-color: var(--accent);
    background: rgba(192,92,26,0.06);
  }

  .option-item.selected {
    border-color: var(--accent);
    background: rgba(192,92,26,0.09);
  }

  .option-key {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent);
    min-width: 1.4rem;
    padding-top: 1px;
  }

  .option-text {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
  }

  .bs-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.5rem;
    font-size: 0.9rem;
  }

  .bs-table th {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .bs-table th:not(:first-child) { text-align: center; }

  .bs-table td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid rgba(46,44,39,0.5);
    vertical-align: middle;
  }

  .bs-table tr:last-child td { border-bottom: none; }
  .bs-table td:not(:first-child) { text-align: center; }

  .bs-toggle {
    display: inline-flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    gap: 0;
  }

  .bs-btn {
    padding: 0.3rem 0.9rem;
    font-size: 0.78rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .bs-btn:hover { color: var(--text); }
  .bs-btn.active-b { background: rgba(111,207,151,0.2); color: var(--correct); }
  .bs-btn.active-s { background: rgba(235,87,87,0.15); color: var(--wrong); }

  .esai-area {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.2rem;
    transition: border-color 0.2s;
  }
  .esai-area:focus-within { border-color: var(--accent); }

  .esai-area textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.92rem;
    line-height: 1.65;
    padding: 0.8rem 1rem;
    resize: vertical;
    min-height: 100px;
  }

  .esai-area textarea::placeholder { color: var(--text-muted); }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 3rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 0.65rem 1.4rem;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    transition: all 0.18s;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-outline:hover { border-color: var(--text-muted); color: var(--text); }

  .btn-primary {
    background: var(--accent);
    color: #fffdf8;
  }
  .btn-primary:hover { background: var(--accent2); }

  .page-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty p { font-size: 0.9rem; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    margin: 2.5rem 0 1.2rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title span { color: var(--accent); }

  .sub-q {
    margin: 0.5rem 0 1rem;
    padding-left: 1rem;
    border-left: 2px solid var(--border);
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  @media(max-width:600px){
    .container { padding: 2rem 1rem 5rem; }
    .q-card { padding: 1.5rem 1.2rem; }
    header { padding: 0 1rem; }
    .header-progress .progress-bar { display: none; }
  }
  mjx-container { color: inherit; font-size: 88% !important; }
  .q-text p { margin-bottom: 0.85rem; }
  .q-text p:last-child { margin-bottom: 0; }
</style>

<header>
  <div class="header-logo">Latihan<em> PU</em></div>
  <div class="header-progress">
    <span id="prog-text">0 / 0 dijawab</span>

  </div>
</header>

<div class="container">

  <div class="hero">

  <div class="filter-row" id="filter-row"></div>
  <div id="questions-container"></div>

</div>

<script>
const soalData = [
  // ---- SOAL 1 ----
  {
    id: 1,
    type: 'pg',
    topic: 'Evaluasi Argumen',
    text: `<p>Kedai Alfa dan Kedai Beta berada di kawasan perkantoran dengan karakteristik pelanggan yang serupa. Keduanya menggunakan biji kopi dari pemasok yang sama dan menjual minuman dengan kisaran harga yang hampir sama. Survei awal juga menunjukkan bahwa penilaian pelanggan terhadap kualitas minuman kedua kedai tidak jauh berbeda.</p>
<p>Setelah tiga bulan, tingkat pembelian ulang pelanggan di Kedai Alfa meningkat sebesar 25%, sedangkan di Kedai Beta cenderung tetap. Belakangan, keluhan pelanggan Kedai Alfa mengenai pesanan yang keliru dan pelayanan yang lambat juga semakin sedikit.</p>
<p>Manakah pernyataan berikut yang PALING TEPAT menjelaskan perbedaan tingkat pembelian ulang di kedua kedai tersebut?</p>`,
    options: [
      '(a) Pelanggan Kedai Alfa mendapatkan pelayanan yang lebih baik setelah melakukan pembelian pertama.',
      '(b) Promosi Kedai Alfa berhasil menarik lebih banyak pekerja kantor yang sebelumnya belum pernah berkunjung.',
      '(c) Kedai Beta menerima lebih banyak pelanggan pada jam makan siang dibandingkan Kedai Alfa.',
      '(d) Aroma minuman Kedai Alfa lebih disukai pelanggan dibandingkan aroma minuman Kedai Beta.',
      '(e) Pelanggan Kedai Alfa melakukan transaksi dengan nilai rata-rata yang lebih besar dibandingkan pelanggan Kedai Beta.'
    ]
  },

  // ---- SOAL 2 ----
  {
    id: 2,
    type: 'pg',
    topic: 'Inferensi Teks',
    text: `<p>Pemerintah Kota Caraka meluncurkan aplikasi "Sapa Warga" untuk pelaporan kerusakan fasilitas umum. Sejak aplikasi ini aktif selama enam bulan, jumlah laporan harian meningkat 45% dibandingkan metode telepon konvensional. Laporan evaluasi menunjukkan bahwa rata-rata waktu penanganan perbaikan infrastruktur jalan menurun dari 14 hari menjadi 6 hari kerja. Indeks kepuasan masyarakat terhadap pelayanan publik bidang infrastruktur juga naik dari skala 65 menjadi 78. Namun, dinas komunikasi menyebutkan sekitar 15% wilayah pinggiran kota masih mengalami kendala stabilitas sinyal internet sehingga aplikasi belum optimal.</p>
<p>Berdasarkan informasi tersebut, manakah pernyataan berikut yang PALING TEPAT?</p>`,
    options: [
      '(a) Semua warga di wilayah pinggiran kota dipastikan menolak menggunakan aplikasi karena masalah internet.',
      '(b) Aplikasi "Sapa Warga" berkontribusi positif meningkatkan efisiensi waktu perbaikan fasilitas di Kota Caraka.',
      '(c) Metode pelaporan konvensional lewat telepon akan dihapus sepenuhnya oleh pemerintah sejak bulan lalu.',
      '(d) Peningkatan indeks kepuasan masyarakat di Kota Caraka hanya dipengaruhi perbaikan jalan berlubang saja.',
      '(e) Waktu pengerjaan fasilitas umum di seluruh wilayah Kota Caraka dipastikan selesai dalam 6 hari kerja.'
    ]
  },

  // ---- SOAL 3 ----
  {
    id: 3,
    type: 'pg',
    topic: 'Penalaran Deduktif',
    text: `<p>Koperasi Simpan Pinjam "Sejahtera Mandiri" memberlakukan ketentuan yang tidak dapat diganggu gugat. Permohonan pencairan dana pinjaman seorang anggota baru dapat diproses oleh bagian administrasi dengan syarat seluruh berkas agunan yang ditetapkan telah diserahkan secara lengkap. Tanpa terpenuhinya hal tersebut, proses verifikasi tidak akan dimulai. Pak Rudianto, anggota aktif yang telah bergabung selama delapan tahun, mengajukan permohonan pinjaman untuk modal usaha peternakan ayamnya. Sampai batas akhir penerimaan berkas hari ini, pihak administrasi mengonfirmasi bahwa permohonan Pak Rudianto belum dapat diproses.</p>
<p>Berdasarkan informasi tersebut, manakah simpulan yang PALING TEPAT?</p>`,
    options: [
      '(a) Pak Rudianto tidak menyerahkan seluruh berkas agunan secara lengkap.',
      '(b) Berkas agunan Pak Rudianto sudah lengkap tetapi pihak administrasi belum sempat memeriksanya.',
      '(c) Pak Rudianto bukan merupakan anggota aktif Koperasi Simpan Pinjam "Sejahtera Mandiri".',
      '(d) Status kelengkapan berkas agunan Pak Rudianto tidak dapat ditentukan dari informasi yang tersedia.',
      '(e) Proses verifikasi terhadap permohonan Pak Rudianto pasti sudah selesai dilakukan.'
    ]
  },

  // ---- SOAL 4 ----
  {
    id: 4,
    type: 'pg',
    topic: 'Evaluasi Argumen',
    text: `<p>Sebuah yayasan pendidikan menerapkan program matematika adaptif menggunakan perangkat lunak MathSmart di SMA Nusantara. Sebelum program dimulai, rata-rata nilai ulangan matematika siswa adalah 68. Setelah satu bulan siswa diwajibkan menggunakan perangkat lunak tersebut selama 45 menit setiap hari seusai sekolah, rata-rata nilai ulangan mereka naik menjadi 82. Kepala sekolah menyimpulkan bahwa aplikasi MathSmart menjadi faktor utama lonjakan nilai tersebut. Namun, seorang pengamat menilai kesimpulan ini perlu diuji kembali karena terdapat potensi variabel lain yang memengaruhi hasil belajar siswa selama periode tersebut.</p>
<p>Informasi yang perlu ditambahkan agar kesimpulan kepala sekolah tersebut TEPAT adalah ...</p>`,

      '(a) Pendapat guru matematika mengenai kemudahan penggunaan fitur absensi pada MathSmart.',

      '(c) Tingkat kepuasan orang tua terhadap desain dan kemudahan penggunaan MathSmart.',
      '(d) Kelompok siswa sebanding tanpa MathSmart tidak mengalami kenaikan nilai serupa.',
      '(e) Jenis perangkat yang paling sering digunakan siswa untuk mengakses MathSmart.'
    ]
  },

  // ---- SOAL 5 ----
  {
    id: 5,
    type: 'pg',
    topic: 'Penalaran Deduktif',
    text: `<p>Pak Gunawan, penyuluh pertanian Desa Sukatani, menjelaskan kepada kelompok tani bahwa kunci kesuksesan panen ada pada pengelolaan tanah. Menurut Pak Gunawan, penerapan pemupukan berimbang secara konsisten merupakan satu-satunya cara untuk meningkatkan kesuburan tanah sawah di wilayah mereka. Kesuburan tanah yang meningkat selalu berujung pada pertumbuhan tanaman padi yang optimal. Selanjutnya, tanaman yang tumbuh optimal sudah pasti akan menghasilkan gabah bermutu tinggi sehingga harga jualnya berada di atas rata-rata pasar dan menguntungkan petani.</p>
<p>Berdasarkan penjelasan Pak Gunawan, manakah pernyataan berikut yang PALING TEPAT?</p>`,
    options: [
      '(a) Jika petani tidak menerapkan pemupukan berimbang secara konsisten, maka pertumbuhan tanaman padi tidak akan optimal.',
      '(b) Jika harga jual gabah tidak berada di atas rata-rata pasar, maka kesuburan tanah sawah tidak mengalami peningkatan.',

      '(e) Kelompok tani di Desa Sukatani dipastikan akan mengalami peningkatan kesuburan tanah sawah dalam waktu dekat.'
    ]
  },

  // ---- SOAL 6 ----
  {
    id: 6,
    type: 'pg',
    topic: 'Penalaran Deduktif',
    text: `<p>Lembaga Sertifikasi Profesi "Nusantara Teknik" menyelenggarakan uji kompetensi bagi calon teknisi instalasi pendingin ruangan. Sesuai regulasi lembaga, sertifikat kompetensi resmi akan diterbitkan secara otomatis bagi setiap peserta yang berhasil menyelesaikan ujian teori dan ujian praktik secara bersamaan. Dimas, peserta yang telah mengikuti pelatihan intensif selama dua bulan, mengikuti uji kompetensi hari ini. Dari lembar hasil yang baru diumumkan, Dimas dinyatakan lulus ujian teori dengan skor memuaskan dan lolos seluruh tahapan ujian praktik tanpa satu pun catatan kesalahan prosedur.</p>
<p>Berdasarkan informasi tersebut, manakah simpulan yang PALING TEPAT?</p>`,

// ===================== STATE =====================
let answers = {};
let activeFilter = 'all';

const TOPICS = ['all', ...new Set(soalData.map(s => s.topic))];

// ===================== RENDER =====================
function renderFilters() {
  const row = document.getElementById('filter-row');
  row.innerHTML = TOPICS.map(t => `
    <button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="setFilter('${t}')">
      ${t === 'all' ? '✦ Semua Topik' : t}
    </button>
  `).join('');
}

function setFilter(topic) {
  activeFilter = topic;
  renderFilters();
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById('questions-container');
  const filtered = activeFilter === 'all' ? soalData : soalData.filter(s => s.topic === activeFilter);

  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Tidak ada soal untuk topik ini.</p></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(s => {
    if (!groups[s.topic]) groups[s.topic] = [];
    groups[s.topic].push(s);
  });

  let html = '';
  let counter = 1;
  Object.entries(groups).forEach(([topic, soals]) => {
    html += `<div class="section-title"><span>◆</span> ${topic}</div>`;
    soals.forEach(s => {
      html += renderCard(s, counter++);
    });
  });

  container.innerHTML = html;
  typesetMath(container);

  updateProgress(filtered);
}

function typesetMath(el) {
  if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
    MathJax.startup.promise.then(() => MathJax.typesetPromise([el])).catch(err => console.error(err));
  }
}

function renderCard(s, num) {
  const typeLabel = s.type === 'pg' ? 'Pilihan Ganda' :
                    s.type === 'ds' ? 'Pilihan Ganda' :
                    s.type === 'bs' ? 'Benar / Salah' : 'Esai';
  const badgeClass = s.type === 'esai' ? 'badge-esai' : s.type === 'bs' ? 'badge-bs' : 'badge-pg';

  let body = '';

  if (s.type === 'pg' || s.type === 'ds') {
    let stmts = '';
    if (s.statements) {
      stmts = `<div class="info-box" style="margin-bottom:1rem">` +
        s.statements.map(st => `${st.label} ${st.text}`).join('<br>') +
        `</div>`;
    }

    const keys = ['a','b','c','d','e'];
    const optHtml = s.options.map((opt, i) => `
      <div class="option-item ${(answers[s.id] === i) ? 'selected' : ''}"
           onclick="selectOption(${s.id}, ${i}, this)">
        <span class="option-key">${keys[i] || String.fromCharCode(97+i)}.</span>
        <span class="option-text">${opt.replace(/^\([a-e]\)\s*/,'')}</span>
      </div>
    `).join('');

    body = stmts + `<div class="options-list">${optHtml}</div>`;

  } else if (s.type === 'bs') {
    const rows = s.bsItems.map((item, i) => `
      <tr>
        <td>${item.label}. ${item.text}</td>
        <td>
          <div class="bs-toggle">
            <button class="bs-btn ${answers[s.id]?.[i] === 'B' ? 'active-b' : ''}"
                    onclick="toggleBS(${s.id}, ${i}, 'B', this)">Benar</button>
            <button class="bs-btn ${answers[s.id]?.[i] === 'S' ? 'active-s' : ''}"
                    onclick="toggleBS(${s.id}, ${i}, 'S', this)">Salah</button>
          </div>
        </td>
      </tr>
    `).join('');

    body = `<table class="bs-table">
      <thead><tr><th>Pernyataan</th><th>Jawaban</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  } else {
    body = `<div class="esai-area">
      <textarea placeholder="Tuliskan jawaban dan langkah penyelesaian kamu di sini…"
                oninput="saveEsai(${s.id}, this.value)">${answers[s.id] || ''}</textarea>
    </div>`;
  }

  return `
    <div class="q-card" id="card-${s.id}">
      <div class="q-meta">
        <span class="q-num">Soal ${num}</span>
        <span class="q-type-badge ${badgeClass}">${typeLabel}</span>
        <span class="q-topic">${s.topic}</span>
      </div>
      <div class="q-text">${s.text}</div>
      ${body}
    </div>
  `;
}

// ===================== INTERACTIONS =====================
function selectOption(id, idx, el) {
  answers[id] = idx;
  const card = document.getElementById('card-' + id);
  card.querySelectorAll('.option-item').forEach((item, i) => {
    item.classList.toggle('selected', i === idx);
  });
  updateProgressAll();
}

function toggleBS(id, itemIdx, val, btn) {
  if (!answers[id]) answers[id] = {};
  const current = answers[id][itemIdx];
  if (current === val) {
    answers[id][itemIdx] = null;
  } else {
    answers[id][itemIdx] = val;
  }
  const toggle = btn.parentElement;
  const [btnB, btnS] = toggle.querySelectorAll('.bs-btn');
  btnB.className = 'bs-btn' + (answers[id][itemIdx] === 'B' ? ' active-b' : '');
  btnS.className = 'bs-btn' + (answers[id][itemIdx] === 'S' ? ' active-s' : '');
  updateProgressAll();
}

function saveEsai(id, val) {
  answers[id] = val;
  updateProgressAll();
}

function isAnswered(s) {
  if (s.type === 'pg' || s.type === 'ds') return answers[s.id] !== undefined;
  if (s.type === 'bs') {
    if (!answers[s.id]) return false;
    return s.bsItems.some((_, i) => answers[s.id][i]);
  }
  if (s.type === 'esai') return answers[s.id] && answers[s.id].trim().length > 0;
  return false;
}

function updateProgress(filtered) { updateProgressAll(); }
function updateProgressAll() {
  const filtered = activeFilter === 'all' ? soalData : soalData.filter(s => s.topic === activeFilter);
  const done = filtered.filter(isAnswered).length;
  const total = filtered.length;
  document.getElementById('prog-text').textContent = `${done} / ${total} dijawab`;
  document.getElementById('prog-fill').style.width = total ? (done/total*100)+'%' : '0%';
}

// ===================== INIT =====================
renderFilters();
renderQuestions();
</script>
